name: CI

on:
  push:
    branches:
      - master
      - main
      - refactor/consultant-to-elite-yar
      - upgrade/laravel-13
      # کارِ روزمره روی برنچ‌های fix/* انجام می‌شود و از آنجا cherry-pick می‌شود.
      # بدون این الگو، هر push به آن‌ها هیچ CIای اجرا نمی‌کرد و اولین بازخورد تا
      # لحظهٔ باز کردنِ PR عقب می‌افتاد — یعنی دقیقاً روی برنچی که بیشترین تغییر
      # را می‌گیرد، کمترین پوشش را داشتیم.
      - 'fix/**'
      # برنچ‌های بازطراحیِ مسیر سفارش/پرداخت — همان استدلالِ بالا.
      - 'redesign/**'
  pull_request:

jobs:
  # ── اسکنِ راز ────────────────────────────────────────────────────────────
  # یک کردنشیالِ واقعی (کلید پادیوم) به‌عنوان مقدارِ پیش‌فرضِ env() کامیت شد و
  # ماه‌ها آنجا ماند. این گیت همان کلاسِ اشتباه را build-breaking می‌کند.
  #
  # عمداً `--no-git` است: فقط درختِ کاری اسکن می‌شود، نه تاریخچه. آن کلیدِ
  # افشاشده هنوز در کامیت‌های پیش از 0d30c06 هست و تصمیمِ تیم این بود که
  # تاریخچه بازنویسی **نشود** (کلید تعویض می‌شود، پس نسخهٔ تاریخی بی‌ارزش است).
  # با اسکنِ تاریخچه، CI برای همیشه و بی‌فایده قرمز می‌ماند.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the working tree
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner --verbose

  tests:
    name: Pint + PHPUnit (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, gd, iconv, pdo_mysql, zip, exif
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations (laravel_testing)
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: laravel_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      - name: Pint (code style, no changes)
        run: ./vendor/bin/pint --test

      - name: PHPStan (static analysis, level 5 + baseline)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: PHPUnit
        env:
          DB_HOST: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact
