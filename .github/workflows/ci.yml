name: CI

on:
  push:
    branches:
      - master
      - main
      # برنچ‌های یکپارچه‌سازیِ جفتِ L10/L13
      - refactor/consultant-to-elite-yar
      - upgrade/laravel-13
      # کارِ روزمره روی برنچ‌های fix/* انجام می‌شود و از آنجا cherry-pick می‌شود.
      # بدون این الگو، هر push به آن‌ها هیچ CIای اجرا نمی‌کرد و اولین بازخورد تا
      # لحظهٔ باز کردنِ PR عقب می‌افتاد — یعنی دقیقاً روی برنچی که بیشترین تغییر
      # را می‌گیرد، کمترین پوشش را داشتیم.
      - 'fix/**'
      # برنچ‌های بازطراحیِ مسیر سفارش/پرداخت — همان استدلالِ بالا.
      - 'redesign/**'
  pull_request:

jobs:
  # ── اسکنِ راز ────────────────────────────────────────────────────────────
  # یک کردنشیالِ واقعی (کلید پادیوم) به‌عنوان مقدارِ پیش‌فرضِ env() کامیت شد و
  # ماه‌ها آنجا ماند. این گیت همان کلاسِ اشتباه را build-breaking می‌کند.
  #
  # عمداً `--no-git` است: فقط درختِ کاری اسکن می‌شود، نه تاریخچه. آن کلیدِ
  # افشاشده هنوز در کامیت‌های پیش از 0d30c06 هست و تصمیمِ تیم این بود که
  # تاریخچه بازنویسی **نشود** (کلید تعویض می‌شود، پس نسخهٔ تاریخی بی‌ارزش است).
  # با اسکنِ تاریخچه، CI برای همیشه و بی‌فایده قرمز می‌ماند.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the working tree
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner --verbose

  tests:
    name: Pint + PHPUnit (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, gd, iconv, pdo_mysql, zip, exif
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # آسیب‌پذیری‌های شناخته‌شدهٔ وابستگی‌ها. تا پیش از این هیچ‌چیز در پروژه
      # خبر نمی‌داد که یک وابستگی آسیب‌پذیر شده — دو CVE از Guzzle و شش مورد از
      # league/commonmark فقط تصادفی و حین یک کار نامرتبط پیدا شدند.
      # مواردی که روی لاراول ۱۰ قابل رفع نیستند در composer.json → config.audit.ignore
      # با دلیل ثبت شده‌اند، پس این گیت فقط برای چیزهای *تازه* قرمز می‌شود.
      - name: Security advisories (composer audit)
        run: composer audit

      # قفل وابستگی‌ها باید با PHPای که واقعاً اجرا می‌شود سازگار باشد.
      # وقتی config.platform.php تنظیم شود، این مرحله همان گیتِ پروداکشن است.
      - name: Platform requirements
        run: composer check-platform-reqs

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations (laravel_testing)
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: laravel_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      - name: Pint (code style, no changes)
        run: ./vendor/bin/pint --test

      - name: PHPStan (static analysis, level 5 + baseline)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # phpstan.neon می‌گوید «سطح را به‌مرور می‌توان بالا برد» و baseline قرار است
      # تدریجاً خالی شود. ولی هیچ‌چیز جلوی بزرگ‌شدنش را نمی‌گرفت: یک خطای جدید را
      # می‌شد با یک `phpstan analyse --generate-baseline` دفن کرد و CI سبز می‌ماند.
      # این مرحله آن نیت را به قانون تبدیل می‌کند — سقف فقط با ویرایشِ عمدیِ همین
      # عدد بالا می‌رود، و پایین‌آوردنش هر وقت خطایی واقعاً رفع شد تشویق می‌شود.
      - name: PHPStan baseline must not grow
        run: |
          CEILING=252
          COUNT=$(grep -c 'message:' phpstan-baseline.neon)
          echo "baseline entries: ${COUNT} (ceiling ${CEILING})"
          if [ "$COUNT" -gt "$CEILING" ]; then
            echo "::error::phpstan-baseline.neon grew from ${CEILING} to ${COUNT}. Fix the new error instead of baselining it, or raise CEILING in this workflow deliberately."
            exit 1
          fi
          if [ "$COUNT" -lt "$CEILING" ]; then
            echo "::notice::baseline shrank to ${COUNT} — lower CEILING in .github/workflows/ci.yml to lock the win in."
          fi

      - name: PHPUnit
        env:
          DB_HOST: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact
