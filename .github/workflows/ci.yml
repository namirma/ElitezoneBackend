name: CI

on:
  push:
    branches:
      - master
      - main
      - refactor/consultant-to-elite-yar
      - upgrade/laravel-13
  pull_request:

jobs:
  tests:
    name: Pint + PHPUnit (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, gd, iconv, pdo_mysql, zip, exif
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # آسیب‌پذیری‌های شناخته‌شدهٔ وابستگی‌ها. تا پیش از این هیچ‌چیز در پروژه
      # خبر نمی‌داد که یک وابستگی آسیب‌پذیر شده — دو CVE از Guzzle و شش مورد از
      # league/commonmark فقط تصادفی و حین یک کار نامرتبط پیدا شدند.
      # مواردی که روی لاراول ۱۰ قابل رفع نیستند در composer.json → config.audit.ignore
      # با دلیل ثبت شده‌اند، پس این گیت فقط برای چیزهای *تازه* قرمز می‌شود.
      - name: Security advisories (composer audit)
        run: composer audit

      # قفل وابستگی‌ها باید با PHPای که واقعاً اجرا می‌شود سازگار باشد.
      # وقتی config.platform.php تنظیم شود، این مرحله همان گیتِ پروداکشن است.
      - name: Platform requirements
        run: composer check-platform-reqs

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations (laravel_testing)
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: laravel_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      - name: Pint (code style, no changes)
        run: ./vendor/bin/pint --test

      - name: PHPStan (static analysis, level 5 + baseline)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: PHPUnit
        env:
          DB_HOST: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact
