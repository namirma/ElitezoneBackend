; ─────────────────────────────────────────────────────────────────────────────
; EliteZone — supervisor config for the queue worker
;
; چرا لازم است: *همهٔ* listenerهای این پروژه ShouldQueue هستند و
; QUEUE_CONNECTION=database است. بدون یک worker که همیشه بالا باشد، پیامک OTP،
; اعلان سفارش و ایمیل‌ها بی‌صدا در جدول `jobs` می‌مانند و هیچ خطایی تولید نمی‌شود.
; (روی همین ماشینِ توسعه هنگام ممیزی، ۷ عدد SendSmsJob با attempts=0 و سنِ ۲۹ تا
; ۴۷ روز پیدا شد — یعنی worker هرگز اجرا نشده بود و هیچ‌کس متوجه نشده بود.)
;
; نصب:
;   sudo cp deploy/supervisor/elitezone-worker.conf /etc/supervisor/conf.d/
;   # سه چیزِ زیر را مطابق سرور ویرایش کنید، بعد:
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status elitezone-worker:*
;
; ⚠️ سه چیزی که **باید** ویرایش شوند — این فایل یک قالب است، نه پیکربندیِ آماده:
;
;   ۱) مفسرِ PHP. اینجا `php` خالی نوشته شده، یعنی هرچه در PATHِ خودِ supervisord
;      اول باشد. شاخهٔ **L13 روی ^8.3** اجرا می‌شود (سرورِ استیجینگ Ubuntu 20.04
;      است و PHP 8.4 برایش منتشر نمی‌شود) — اگر PHPِ پیش‌فرضِ سرور قدیمی‌تر باشد،
;      ورکر بی‌صدا بالا نمی‌آید و jobها در جدول `jobs` می‌مانند بدون هیچ خطایی.
;      مسیرِ کامل بنویسید، مثلاً `/usr/bin/php8.3`. با `php -v` و `ls /usr/bin/php*` بررسی کنید.
;
;   ۲) ریشهٔ اپ. روی شاخهٔ L10 برنامه داخل زیرشاخهٔ `api/` است و روی شاخهٔ **L13
;      در ریشهٔ خودِ مخزن**. یعنی همان مسیرِ `/var/www/elitezone/api` که پایین
;      نوشته شده، پس از سوئیچ به L13 دیگر درست نیست. مسیر را با
;      `dirname $(find /var/www -name artisan | head -1)` پیدا کنید.
;
;   ۳) کاربر (`user=`) — باید همان کاربری باشد که روی `storage/` و
;      `bootstrap/cache/` دسترسیِ نوشتن دارد.
; ─────────────────────────────────────────────────────────────────────────────

[program:elitezone-worker]
process_name=%(program_name)s_%(process_num)02d
; --tries=3 با backoff پیش‌فرضِ jobها هماهنگ است؛ jobهای شکست‌خورده به failed_jobs می‌روند.
; --max-time=3600 هر ساعت پروسه را بازیافت می‌کند (جلوگیری از نشتِ حافظه در پروسهٔ طولانی).
; --sleep=3 مصرفِ CPU را پایین نگه می‌دارد وقتی صف خالی است.
command=php /var/www/elitezone/api/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600
directory=/var/www/elitezone/api
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
; دو پروسه برای موازی‌سازی. اگر بالا بردید، حواستان به قفل‌های مالی باشد:
; میدل‌ور Idempotency روی storeِ مشترک قفل می‌گیرد (config/idempotency.php)، پس
; چند worker امن است — ولی درایورِ کشِ `file` این تضمین را نمی‌دهد.
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/elitezone/api/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
; مهلت به job جاری برای اتمام هنگام deploy/restart — از نصفه‌کاره ماندنِ
; یک عملیاتِ مالی جلوگیری می‌کند.
stopwaitsecs=3600

; ─────────────────────────────────────────────────────────────────────────────
; scheduler — بدون این، هیچ‌کدام از کارهای زمان‌بندی‌شده اجرا نمی‌شوند
; (لغو سفارش‌های منقضی، تسویهٔ بدهی تأمین‌کننده، پشتیبان‌گیری، queue:health).
; زمان‌بندی روی L10 در `app/Console/Kernel.php` تعریف می‌شود و روی L13 در
; `routes/console.php`؛ برای supervisor فرقی ندارد — همان `schedule:work`.
;
; جایگزینِ supervisor برای این یکی، یک خط در crontab است:
;   * * * * * cd /var/www/elitezone/api && php artisan schedule:run >> /dev/null 2>&1
; ─────────────────────────────────────────────────────────────────────────────

[program:elitezone-scheduler]
process_name=%(program_name)s
command=php /var/www/elitezone/api/artisan schedule:work
directory=/var/www/elitezone/api
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/elitezone/api/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; پس از هر deploy لازم است تا workerها کدِ جدید را بردارند:
;   php artisan queue:restart
