# پیکربندی gitleaks — اسکنِ رازِ کامیت‌شده.
#
# چرا اصلاً: کلید واقعی پادیوم (`PODIUM_SC_API_KEY_COMPANY`) تا کامیت 0d30c06
# به‌عنوان مقدارِ پیش‌فرضِ `env()` در `config/services.php` نشسته بود. هیچ‌چیز در
# پروژه جلویش را نگرفت و هیچ‌چیز هم خبر نداد؛ فقط حین یک بازبینیِ دستی پیدا شد.
#
# ⚠️ این اسکن عمداً **تاریخچه را نمی‌بیند** و فقط درخت کاری را می‌خواند
# (`--no-git` در ci.yml). دلیلش در همان‌جا نوشته شده: آن کلید هنوز در
# کامیت‌های پیش از 0d30c06 خواندنی است و بازنویسیِ تاریخچه تصمیمِ تیم بود که
# انجام **نشود** — کلید تعویض می‌شود و نسخهٔ داخل تاریخچه بی‌ارزش می‌گردد.
# اگر روزی تاریخچه اسکن شود، این فایل به یک allowlist برای همان کامیت‌ها
# نیاز دارد وگرنه CI برای همیشه قرمز می‌ماند.

[extend]
useDefault = true

[allowlist]
description = "مقادیرِ نمونه و ثابت‌های بی‌خطر"

paths = [
    # فقط placeholder دارد؛ خودِ همین فایل قرارداد است و باید خوانا بماند.
    '''\.env\.example$''',
    '''\.env\.cloud\.example$''',
    # فیکسچرهای تست، توکنِ ساختگی و کلیدهای نمونه‌ی امضا.
    '''^tests/''',
    # قفلِ وابستگی‌ها پر از هشِ base64 است که شبیهِ راز دیده می‌شود.
    '''composer\.lock$''',
    '''package-lock\.json$''',
]

regexes = [
    # کدِ OTP توسعه — یک ثابتِ مستندشده در config/auth.php است و در پروداکشن
    # نادیده گرفته می‌شود (همیشه CSPRNG). راز نیست.
    '''111111''',
]
